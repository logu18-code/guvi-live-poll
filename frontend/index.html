<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Poll</title>
  <meta name="description" content="Create polls, vote, and see the results.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%230B7A6E'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body data-auth="out">
  <a class="skip-link" href="#polls-heading">Skip to polls</a>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <h1 class="brand-name">Live Poll</h1>
        <p class="brand-tagline">Create. Vote. See the results.</p>
      </div>

      <div class="header-right">
        <!-- Reflects whether the backend is reachable, not vote activity. -->
        <p class="backend-status" id="backend-status" data-state="checking">
          <span class="pulse" aria-hidden="true"></span>
          <span id="backend-status-text">Checking server</span>
        </p>

        <div class="user-info" id="user-info" hidden>
          <span class="user-name" id="user-name"></span>
          <span class="user-email" id="user-email"></span>
          <button type="button" class="btn btn-secondary btn-small" id="logout-btn">Log out</button>
        </div>
      </div>
    </div>
  </header>

  <noscript>
    <p class="noscript">Live Poll needs JavaScript to run. Enable it in your browser and reload.</p>
  </noscript>

  <main class="layout">
    <!-- Polls come first in the source order so they lead on small screens. -->
    <section class="polls-column" aria-labelledby="polls-heading">
      <div class="section-head">
        <h2 id="polls-heading" tabindex="-1">Active polls</h2>
        <div class="section-tools">
          <span class="updated" id="updated-at"></span>
          <button type="button" class="btn btn-secondary btn-small" id="refresh-btn">Refresh</button>
        </div>
      </div>

      <p class="notice" id="polls-notice" role="alert" hidden></p>
      <div class="polls-list" id="polls-list"></div>
    </section>

    <aside class="side-column">
      <!-- Shown when logged out -->
      <section class="panel" id="auth-panel" aria-labelledby="auth-heading">
        <h2 id="auth-heading">Join to vote</h2>
        <p class="panel-intro">Log in or create an account to vote and make your own polls.</p>

        <div class="tabs" role="tablist" aria-label="Account">
          <button type="button" class="tab" role="tab" id="tab-login" aria-controls="login-form" aria-selected="true">Log in</button>
          <button type="button" class="tab" role="tab" id="tab-signup" aria-controls="signup-form" aria-selected="false" tabindex="-1">Sign up</button>
        </div>

        <form id="login-form" role="tabpanel" aria-labelledby="tab-login" novalidate>
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <p class="notice" id="login-error" role="alert" hidden></p>
          <button type="submit" class="btn btn-primary btn-block" id="login-submit">Log in</button>
        </form>

        <form id="signup-form" role="tabpanel" aria-labelledby="tab-signup" novalidate hidden>
          <div class="field">
            <label for="signup-name">Name</label>
            <input id="signup-name" name="name" type="text" autocomplete="name" maxlength="60" required>
          </div>
          <div class="field">
            <label for="signup-email">Email</label>
            <input id="signup-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="signup-password">Password</label>
            <input id="signup-password" name="password" type="password" autocomplete="new-password" aria-describedby="signup-password-hint" required>
            <span class="hint" id="signup-password-hint">At least 8 characters.</span>
          </div>
          <p class="notice" id="signup-error" role="alert" hidden></p>
          <button type="submit" class="btn btn-primary btn-block" id="signup-submit">Create account</button>
        </form>
      </section>

      <!-- Shown when logged in -->
      <section class="panel" id="create-panel" aria-labelledby="create-heading" hidden>
        <h2 id="create-heading">Create a poll</h2>

        <form id="create-form" novalidate>
          <div class="field">
            <label for="poll-question">Question</label>
            <input id="poll-question" name="question" type="text" maxlength="200" autocomplete="off" placeholder="What is your favorite language?" required>
          </div>

          <fieldset class="options-field">
            <legend>Options</legend>
            <div id="option-inputs"></div>
            <button type="button" class="btn btn-secondary btn-small" id="add-option-btn">Add option</button>
          </fieldset>

          <p class="notice" id="create-error" role="alert" hidden></p>
          <button type="submit" class="btn btn-primary btn-block" id="create-submit">Create poll</button>
        </form>
      </section>
    </aside>
  </main>

  <!-- Transient confirmations, and a hidden region so screen readers hear outcomes. -->
  <div class="toast" id="toast" hidden></div>
  <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
